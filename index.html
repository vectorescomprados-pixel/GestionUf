<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <title>GestiónUF Pro - Final Blindada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --bg: #f0f2f5; --card: #ffffff; --primary: #2563eb; 
            --danger: #e11d48; --text: #1f293b; --border: #e5e7eb; 
            --warning: #f59e0b; --success: #22c55e;
        }
        body.dark-mode { 
            --bg: #0b141a; --card: #111b21; --text: #e9edef; --border: #222d34;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; transition: background 0.2s; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
        .wrap { width: 95%; max-width: 450px; position: relative; }
        .hidden { display: none !important; }

        /* HEADER */
        .main-header { position: fixed; top: 0; width: 95%; max-width: 450px; background: var(--card); z-index: 1000; padding: 15px; border-bottom: 3px solid var(--primary); border-radius: 0 0 15px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .content-body { margin-top: 360px; width: 100%; padding-bottom: 100px; }

        /* BOTONES */
        .grid-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .btn { height: 42px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%; }
        .primary { background: var(--primary); } .danger { background: var(--danger); } .ghost { background: #64748b; } .warning { background: var(--warning); color: #000; }

        /* REGISTROS */
        .item { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); width: 100%; }
        .item.no-phone { border-left: 8px solid var(--warning); background: rgba(245, 158, 11, 0.05); }
        .item b { font-size: 18px; color: var(--primary); }
        .details { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }

        input { width: 100%; height: 45px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); padding: 0 15px; background: var(--bg); color: var(--text); font-size: 16px; }

        /* MENSAJE NO ENCONTRADO */
        .no-data { text-align: center; padding: 40px 20px; color: var(--ghost); font-weight: bold; }
        .no-data i { display: block; font-size: 40px; margin-bottom: 15px; opacity: 0.5; }

        /* MODALES */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }

        #btn-rocket { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; z-index: 2000; display: none; }
    </style>
</head>
<body class="dark-mode">

    <button id="btn-rocket" class="btn primary"><i class="fas fa-rocket"></i></button>
    <input type="file" id="csv-file" accept=".csv" class="hidden">

    <div id="login-screen" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center; margin-bottom:20px; color:var(--primary)">GestiónUF</h2>
            <input id="login-user" placeholder="Usuario">
            <input id="login-pass" type="password" placeholder="Contraseña">
            <button id="btn-login" class="btn primary">ENTRAR</button>
            <button id="btn-recover-open" class="btn ghost" style="margin-top:10px">OLVIDÉ MI CONTRASEÑA</button>
        </div>
    </div>

    <div id="main-screen" class="wrap hidden">
        <div class="main-header">
            <div id="conn-status" style="font-size:10px; text-align:center; margin-bottom:8px; color:var(--success)">● APP EN LÍNEA</div>
            <div class="grid-btns">
                <button id="btn-log-toggle" class="btn ghost">LOG</button>
                <button id="btn-theme" class="btn ghost">MODO</button>
                <button id="btn-logout" class="btn danger">SALIR</button>
            </div>
            <div class="grid-btns">
                <button id="btn-add" class="btn primary">NUEVA UF</button>
                <button id="btn-import" class="btn ghost">IMPORTAR</button>
                <button id="btn-export" class="btn ghost">EXPORTAR</button>
            </div>
            <input id="search-input" placeholder="Buscar UF o Propietario...">
            <div class="grid-btns">
                <button id="btn-search" class="btn primary">BUSCAR</button>
                <button id="btn-clear" class="btn ghost">VER TODO</button>
                <button id="btn-filter-empty" class="btn warning">VACÍOS</button>
            </div>
            <button id="btn-delete-all" class="btn danger" style="width:100%">BORRAR BASE DE DATOS</button>
        </div>
        <div class="content-body">
            <div id="log-panel" class="hidden" style="background:#000; color:#0f0; padding:10px; font-size:10px; margin-bottom:15px; height:80px; overflow:auto; border-radius:8px"></div>
            <div id="list"></div>
        </div>
    </div>

    <div id="modal-form" class="modal hidden">
        <div class="modal-content">
            <h3 id="form-title" style="margin-bottom:15px; text-align:center">Ficha de Unidad</h3>
            <input id="f-uf" placeholder="UF">
            <input id="f-prop" placeholder="Propietario">
            <input id="f-telp" placeholder="Tel Propietario">
            <input id="f-inq" placeholder="Inquilino">
            <input id="f-teli" placeholder="Tel Inquilino">
            <div class="grid-btns" style="margin-top:10px">
                <button id="btn-save" class="btn primary">GUARDAR</button>
                <button id="btn-cancel" class="btn danger">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="modal hidden">
        <div class="modal-content" style="text-align:center">
            <h3 id="confirm-title">Confirmar</h3>
            <p id="confirm-msg" style="font-size:13px; margin:10px 0"></p>
            <input id="confirm-pass" type="password" placeholder="Contraseña Admin">
            <div class="grid-btns">
                <button id="btn-confirm-yes" class="btn primary">ACEPTAR</button>
                <button id="btn-confirm-no" class="btn danger">VOLVER</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, updateDoc, doc, deleteDoc, orderBy, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDxw26xM3pliNxo79LdvWkr0uOGdvCgiIo", authDomain: "gestionuf-remoto.firebaseapp.com",
            projectId: "gestionuf-remoto", storageBucket: "gestionuf-remoto.firebasestorage.app",
            messagingSenderId: "724452752860", appId: "1:724452752860:web:4d25585addcdcbd146e319"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let departamentos = [];
        let editId = null;
        let pendingAction = null;

        const writeLog = (msg) => {
            const lp = document.getElementById("log-panel");
            lp.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            lp.scrollTop = lp.scrollHeight;
        };

        const login = () => {
            if(document.getElementById("login-user").value === "admin" && document.getElementById("login-pass").value === "admin") {
                localStorage.setItem("uf_auth", "true");
                location.reload();
            } else alert("Credenciales incorrectas");
        };
        document.getElementById("btn-login").onclick = login;
        document.getElementById("login-pass").onkeyup = (e) => { if(e.key === "Enter") login(); };

        if(localStorage.getItem("uf_auth") === "true") {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-screen").classList.remove("hidden");
            onSnapshot(query(collection(db, "departamentos"), orderBy("UF", "asc")), (snap) => {
                departamentos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render(departamentos);
            });
        }

        function render(data) {
            const list = document.getElementById("list");
            list.innerHTML = "";
            
            // LEYENDA SI NO HAY REGISTROS
            if(data.length === 0) {
                list.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-search"></i>
                        REGISTRO NO ENCONTRADO
                    </div>`;
                return;
            }

            data.forEach(d => {
                const sinT = !d.TelefonoPropietario && !d.TelefonoInquilino;
                const tel = d.TelefonoPropietario || d.TelefonoInquilino || "";
                const div = document.createElement("div");
                div.className = `item ${sinT ? 'no-phone' : ''}`;
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <b>UF ${d.UF}</b>
                        <div style="display:flex; gap:15px">
                            <i class="fas fa-eye" style="cursor:pointer" onclick="document.getElementById('det-${d.id}').classList.toggle('hidden')"></i>
                            <i class="fas fa-edit" style="cursor:pointer" onclick="window.editUF('${d.id}')"></i>
                            <i class="fas fa-trash" style="color:var(--danger); cursor:pointer" onclick="window.askConfirm('Eliminar registro UF ${d.UF}', 'delete', '${d.id}')"></i>
                        </div>
                    </div>
                    <div id="det-${d.id}" class="details hidden">
                        <p style="font-size:13px"><b>Prop:</b> ${d.Propietario || "-"}</p>
                        <p style="font-size:13px"><b>Inq:</b> ${d.Inquilino || "-"}</p>
                        <div style="display:flex; gap:10px; margin-top:10px">
                            <a href="tel:${tel}" class="btn primary" style="height:35px"><i class="fas fa-phone"></i></a>
                            <a href="https://wa.me/${tel.replace(/\D/g,'')}" target="_blank" class="btn" style="height:35px; background:#25d366"><i class="fab fa-whatsapp"></i></a>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        window.askConfirm = (msg, type, id = null) => {
            pendingAction = { type, id };
            document.getElementById("confirm-msg").innerText = msg;
            document.getElementById("confirm-pass").value = "";
            document.getElementById("modal-confirm").classList.remove("hidden");
        };

        document.getElementById("btn-confirm-yes").onclick = async () => {
            if(document.getElementById("confirm-pass").value !== "admin") return alert("Contraseña incorrecta");
            if(pendingAction.type === 'delete') await deleteDoc(doc(db, "departamentos", pendingAction.id));
            if(pendingAction.type === 'deleteAll') {
                const batch = writeBatch(db);
                (await getDocs(collection(db, "departamentos"))).forEach(d => batch.delete(d.ref));
                await batch.commit();
            }
            if(pendingAction.type === 'export') {
                const headers = "UF,Propietario,Tel_Prop,Inquilino,Tel_Inq\n";
                const rows = departamentos.map(d => `${d.UF},${d.Propietario},${d.TelefonoPropietario},${d.Inquilino},${d.TelefonoInquilino}`).join("\n");
                const link = document.createElement("a");
                link.href = URL.createObjectURL(new Blob([headers + rows], { type: 'text/csv' }));
                link.download = "Base_Datos.csv"; link.click();
            }
            document.getElementById("modal-confirm").classList.add("hidden");
        };

        document.getElementById("btn-export").onclick = () => window.askConfirm("Se procederá a la descarga de la base de datos.", "export");
        document.getElementById("btn-delete-all").onclick = () => window.askConfirm("PELIGRO: Se borrará TODA la base de datos.", "deleteAll");
        document.getElementById("btn-add").onclick = () => {
            editId = null; document.getElementById("form-title").innerText = "Nueva UF";
            document.querySelectorAll("#modal-form input").forEach(i => i.value = "");
            document.getElementById("modal-form").classList.remove("hidden");
        };
        window.editUF = (id) => {
            const d = departamentos.find(x => x.id === id); editId = id;
            document.getElementById("f-uf").value = d.UF; document.getElementById("f-prop").value = d.Propietario || "";
            document.getElementById("f-telp").value = d.TelefonoPropietario || ""; document.getElementById("f-inq").value = d.Inquilino || "";
            document.getElementById("f-teli").value = d.TelefonoInquilino || "";
            document.getElementById("modal-form").classList.remove("hidden");
        };
        document.getElementById("btn-save").onclick = async () => {
            const data = { UF: document.getElementById("f-uf").value, Propietario: document.getElementById("f-prop").value, TelefonoPropietario: document.getElementById("f-telp").value, Inquilino: document.getElementById("f-inq").value, TelefonoInquilino: document.getElementById("f-teli").value };
            if(editId) await updateDoc(doc(db, "departamentos", editId), data);
            else await addDoc(collection(db, "departamentos"), data);
            document.getElementById("modal-form").classList.add("hidden");
        };

        const search = () => {
            const v = document.getElementById("search-input").value.toLowerCase();
            render(departamentos.filter(d => d.UF.includes(v) || (d.Propietario && d.Propietario.toLowerCase().includes(v))));
        };
        document.getElementById("btn-search").onclick = search;
        document.getElementById("search-input").onkeyup = (e) => { if(e.key === "Enter") search(); };
        document.getElementById("btn-clear").onclick = () => { document.getElementById("search-input").value = ""; render(departamentos); };
        document.getElementById("btn-filter-empty").onclick = () => render(departamentos.filter(d => !d.Inquilino));

        document.getElementById("btn-theme").onclick = () => document.body.classList.toggle("dark-mode");
        document.getElementById("btn-logout").onclick = () => { localStorage.clear(); location.reload(); };
        document.getElementById("btn-cancel").onclick = () => document.getElementById("modal-form").classList.add("hidden");
        document.getElementById("btn-confirm-no").onclick = () => document.getElementById("modal-confirm").classList.add("hidden");
        document.getElementById("btn-recover-open").onclick = () => alert("Soporte: 12345678");

        window.onscroll = () => { document.getElementById("btn-rocket").style.display = window.scrollY > 300 ? "block" : "none"; };
        document.getElementById("btn-rocket").onclick = () => window.scrollTo({top:0, behavior:'smooth'});
    </script>
</body>
</html>
