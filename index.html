<body class="dark-mode">
    <input type="file" id="csv-file" accept=".csv" style="display:none">
    
    <button id="btn-rocket" title="Volver arriba"><i class="fas fa-rocket"></i></button>

    <div class="wrap">
        <div class="top-controls">
            <div class="control-group">
                <span>Ver Log</span>
                <label class="switch"><input type="checkbox" id="log-toggle" checked><span class="slider"></span></label>
            </div>
            <div id="sync-status" style="color: #22c55e; font-size: 11px; font-weight: bold;">● APP EN LÍNEA</div>
            <div class="control-group">
                <span>Modo Oscuro</span>
                <label class="switch"><input type="checkbox" id="mode-toggle" checked><span class="slider"></span></label>
            </div>
        </div>

        <div id="login-screen" class="card">
            <h1>GestiónUF Cloud</h1>
            <input id="login-user" placeholder="Usuario">
            <input id="login-pass" type="password" placeholder="Contraseña">
            <button id="btn-login" class="btn primary" style="width:100%">Entrar</button>
            <button id="btn-recover" class="btn ghost" style="width:100%; margin-top:10px;">Recuperar Admin</button>
        </div>

        <div id="main-screen" class="card hidden">
            <div class="grid-btns">
                <button id="btn-add" class="btn primary">+ Nueva UF</button>
                <button id="btn-import" class="btn admin-only">Importar CSV</button>
                <button id="btn-export" class="btn">Exportar</button>
                <button id="btn-users" class="btn admin-only">Cuentas</button>
                <button id="btn-logout" class="btn danger">Salir</button>
            </div>

            <section class="search-section">
                <div style="position:relative; margin-bottom: 8px;">
                    <input id="search-text" placeholder="Buscar UF o Nombre...">
                </div>
                <div class="grid-btns">
                    <button id="btn-search" class="btn primary">Buscar</button>
                    <button id="btn-clear" class="btn">Limpiar</button>
                    <button id="btn-list-empty" class="btn warning-btn">Vacíos</button>
                </div>
            </section>

            <div id="list"></div>

            <div id="log-container" class="log-container">
                <h4 class="muted">Actividad Reciente</h4>
                <div id="log-list"></div>
            </div>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
