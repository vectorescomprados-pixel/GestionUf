<div class="grid-btns">
    <button id="btn-search" class="btn primary">BUSCAR</button>
    <button id="btn-clear" class="btn ghost">VER TODO</button> <button id="btn-filter-empty" class="btn" style="background:var(--warning); color:black">VACÍOS</button>
</div>

<div id="modal-recover" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10002; display:flex; align-items:center; justify-content:center">
    <div class="wrap" style="background:var(--card); padding:25px; border-radius:15px; text-align:center">
        <h3>Recuperar Acceso</h3>
        <p style="font-size:12px; margin-bottom:15px">Ingrese su número de teléfono registrado para validar su identidad</p>
        <input id="rec-tel" placeholder="Número de Teléfono (sin espacios)">
        <div id="step-new-pass" class="hidden">
            <input id="new-pass" type="password" placeholder="Nueva Contraseña">
        </div>
        <div class="grid-btns">
            <button id="btn-rec-verify" class="btn primary">VERIFICAR</button>
            <button id="btn-rec-cancel" class="btn danger">CANCELAR</button>
        </div>
    </div>
</div>
