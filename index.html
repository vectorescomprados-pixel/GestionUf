<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GestiónUF Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- TODA LA ESTÉTICA INTEGRADA AQUÍ --- */
        :root {
            --bg: #f0f2f5; --card: #ffffff; --primary: #2563eb; 
            --danger: #e11d48; --text: #1f293b; --border: #e5e7eb; 
            --warning: #f59e0b; --success: #22c55e;
        }
        body.dark-mode {
            --bg: #0b141a; --card: #111b21; --text: #e9edef; --border: #222d34;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.3s; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; }

        /* Ajuste para Android y PC */
        .wrap { width: 95%; max-width: 450px; margin: auto; padding: 0 5px; }

        /* Cabecera Fija con Armonía */
        .main-header {
            position: fixed; top: 0; width: 95%; max-width: 450px; 
            background: var(--card); z-index: 1000; padding: 15px; 
            border-bottom: 3px solid var(--primary); border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .status-bar { font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 8px; }
        .online { color: var(--success); }
        .offline { color: var(--danger); }

        .content-body { margin-top: 340px; width: 100%; padding-bottom: 80px; }

        /* Consola Log */
        #log-panel { 
            background: #000; color: #0f0; padding: 10px; font-size: 11px; 
            border-radius: 8px; margin-bottom: 15px; height: 100px; overflow-y: auto;
            width: 100%; font-family: monospace; border: 1px solid #333;
        }

        /* Tarjetas de Registros */
        .item { 
            background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px;
            border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .item.no-phone { border-left: 8px solid var(--warning); background: rgba(245, 158, 11, 0.03); }

        .grid-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .btn { 
            height: 42px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; 
            cursor: pointer; color: white; display: flex; align-items: center; justify-content: center;
        }
        .primary { background: var(--primary); }
        .danger { background: var(--danger); }
        .ghost { background: #64748b; }

        /* Cohete lateral */
        #btn-rocket {
            position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
            background: var(--primary); color: white; border-radius: 50%; border: none; 
            z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Modales */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
        
        input { 
            width: 100%; height: 45px; margin-bottom: 10px; border-radius: 10px; 
            border: 1px solid var(--border); padding: 0 15px; background: var(--bg); 
            color: var(--text); font-size: 16px;
        }

        /* Login Card */
        .login-card { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; width: 100%; }
    </style>
</head>
<body class="dark-mode">
    <button id="btn-rocket" class="hidden"><i class="fas fa-rocket"></i></button>
    <input type="file" id="csv-file" accept=".csv" class="hidden">

    <div id="login-screen" class="modal">
        <div class="wrap" style="max-width: 350px;">
            <div class="login-card">
                <h2 style="color:var(--primary); margin-top:0;">GestiónUF</h2>
                <input id="login-user" placeholder="Usuario">
                <input id="login-pass" type="password" placeholder="Contraseña">
                <button id="btn-login" class="btn primary" style="width:100%; font-size:14px;">ENTRAR</button>
                <button id="btn-recover-open" class="btn ghost" style="width:100%; margin-top:10px;">OLVIDÉ MI CONTRASEÑA</button>
            </div>
        </div>
    </div>

    <div id="main-screen" class="hidden">
        <div class="wrap">
            <div class="main-header">
                <div id="conn-status" class="status-bar online">● APP EN LÍNEA</div>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                    <button id="btn-log-toggle" class="btn ghost" style="width:30%">LOG</button>
                    <button id="btn-theme" class="btn ghost" style="width:30%">MODO</button>
                    <button id="btn-logout" class="btn danger" style="width:30%">SALIR</button>
                </div>
                <div class="grid-btns">
                    <button id="btn-add" class="btn primary">NUEVA UF</button>
                    <button id="btn-import" class="btn ghost">IMPORTAR</button>
                    <button id="btn-export" class="btn ghost">EXPORTAR</button>
                </div>
                <input id="search-input" placeholder="Buscar UF o Propietario...">
                <div class="grid-btns">
                    <button id="btn-search" class="btn primary">BUSCAR</button>
                    <button id="btn-clear" class="btn ghost">VER TODO</button>
                    <button id="btn-filter-empty" class="btn" style="background:var(--warning); color:black">VACÍOS</button>
                </div>
                <button id="btn-delete-all" class="btn danger" style="width:100%">BORRAR BASE DE DATOS</button>
            </div>

            <div class="content-body">
                <div id="log-panel" class="hidden"></div>
                <div id="list"></div>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal hidden">
        <div class="wrap" style="background:var(--card); padding:25px; border-radius:20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3 id="form-title" style="margin-top:0; color:var(--primary);">Ficha de Unidad</h3>
            <input id="f-uf" placeholder="UF">
            <input id="f-prop" placeholder="Propietario">
            <input id="f-telp" placeholder="Tel Propietario">
            <input id="f-inq" placeholder="Inquilino">
            <input id="f-teli" placeholder="Tel Inquilino">
            <div class="grid-btns" style="margin-top:15px;">
                <button id="btn-save" class="btn primary">GUARDAR</button>
                <button id="btn-cancel" class="btn danger">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="modal hidden">
        <div class="wrap" style="background:var(--card); padding:25px; border-radius:15px; text-align:center;">
            <h3 id="confirm-title" style="margin-top:0;">Confirmar Acción</h3>
            <p id="confirm-msg" style="font-size:13px; margin-bottom:15px;"></p>
            <input id="confirm-pass" type="password" placeholder="Clave de Administrador">
            <div class="grid-btns">
                <button id="btn-confirm-yes" class="btn primary">ACEPTAR</button>
                <button id="btn-confirm-no" class="btn danger">VOLVER</button>
            </div>
        </div>
    </div>

    <div id="modal-recover" class="modal hidden">
        <div class="wrap" style="background:var(--card); padding:25px; border-radius:20px; text-align:center;">
            <h3 style="color:var(--primary); margin-top:0;">Recuperar Acceso</h3>
            <div id="step-1">
                <p style="font-size:12px;">Ingrese su teléfono registrado:</p>
                <input id="rec-tel" type="tel" placeholder="Ej: 1122334455">
                <button id="btn-verify-tel" class="btn primary" style="width:100%">VERIFICAR</button>
            </div>
            <div id="step-2" class="hidden">
                <p style="font-size:12px;">Nueva contraseña deseada:</p>
                <input id="new-pass" type="password" placeholder="Mínimo 4 caracteres">
                <button id="btn-save-pass" class="btn primary" style="width:100%">ESTABLECER CLAVE</button>
            </div>
            <button id="btn-close-rec" class="btn danger" style="width:100%; margin-top:10px;">CERRAR</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
