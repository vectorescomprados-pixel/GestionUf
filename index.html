<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <title>GestiónUF Cloud</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-mode">
    <input type="file" id="csv-file" accept=".csv" style="display:none">
    <button id="btn-rocket"><i class="fas fa-rocket"></i></button>

    <div class="wrap">
        <div id="login-screen" class="card" style="margin-top: 50px;">
            <h1 style="text-align:center">GestiónUF</h1>
            <input id="login-user" type="text" placeholder="Usuario" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); color:white;">
            <input id="login-pass" type="password" placeholder="Contraseña" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); color:white;">
            <button id="btn-login" class="btn primary" style="width:100%">ENTRAR</button>
            <button id="btn-recover" class="btn ghost" style="width:100%; margin-top:10px;">Olvidé mi contraseña</button>
        </div>

        <div id="main-screen" class="hidden">
            <div class="main-header">
                <div id="sync-status">● APP CONECTADA A LA NUBE</div>
                
                <div class="card" style="padding: 10px; margin-bottom: 8px;">
                    <div class="grid-btns">
                        <button id="btn-add" class="btn primary"><i class="fas fa-plus"></i> NUEVA UF</button>
                        <button id="btn-import" class="btn ghost admin-only"><i class="fas fa-upload"></i> IMPORTAR</button>
                        <button id="btn-users" class="btn ghost admin-only"><i class="fas fa-users"></i> CUENTAS</button>
                        <button id="btn-logout" class="btn danger"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>

                <div class="card" style="padding: 10px; margin-bottom: 0;">
                    <input id="search-text" type="text" placeholder="Buscar por UF o Nombre..." style="width:100%; padding:12px; margin-bottom:8px; border-radius:8px; border:1px solid var(--border); background:var(--input-bg); color:white;">
                    <div class="grid-btns">
                        <button id="btn-search" class="btn primary">BUSCAR</button>
                        <button id="btn-clear" class="btn ghost">LIMPIAR / TODO</button>
                    </div>
                </div>
            </div>

            <div id="list"></div>
            
            <div id="log-container" class="card" style="font-size: 11px; opacity: 0.8; height: 120px; overflow-y: auto;">
                <h4 style="margin:0 0 5px 0">Actividad Reciente</h4>
                <div id="log-list"></div>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal hidden">
        <div class="modal-content card" style="width: 90%; max-width: 400px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000;">
            <h3 id="modal-title">Datos de Unidad</h3>
            <input id="f-uf" placeholder="UF (ej: 0001)" style="width:100%; padding:10px; margin-bottom:10px;">
            <input id="f-prop" placeholder="Propietario" style="width:100%; padding:10px; margin-bottom:10px;">
            <input id="f-telp" placeholder="Tel Propietario" style="width:100%; padding:10px; margin-bottom:10px;">
            <input id="f-inq" placeholder="Inquilino" style="width:100%; padding:10px; margin-bottom:10px;">
            <input id="f-teli" placeholder="Tel Inquilino" style="width:100%; padding:10px; margin-bottom:15px;">
            <div class="grid-btns">
                <button id="btn-save" class="btn primary">GUARDAR</button>
                <button id="btn-cancel" class="btn danger">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modal-recover" class="modal hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:4000; display:flex; align-items:center; justify-content:center;">
        <div class="card" style="width:80%;">
            <h3>Validar Maestro</h3>
            <input id="recover-phone" placeholder="Celular Maestro">
            <div id="recover-step-2" class="hidden"><input id="new-admin-pass" type="password" placeholder="Nueva Clave"></div>
            <div class="grid-btns"><button id="btn-verify-phone" class="btn primary">Verificar</button><button id="btn-close-recover" class="btn danger">X</button></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
