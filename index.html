<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GestiónUF</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-mode">
    <button id="btn-rocket"><i class="fas fa-rocket"></i></button>
    <input type="file" id="csv-file" accept=".csv" style="display:none">

    <div id="login-screen" class="modal">
        <div class="modal-content">
            <h2 style="text-align:center">Acceso</h2>
            <input id="login-user" placeholder="Usuario">
            <input id="login-pass" type="password" placeholder="Contraseña">
            <button id="btn-login" class="btn primary" style="width:100%">ENTRAR</button>
            <button id="btn-open-recover" class="btn ghost" style="width:100%; margin-top:10px">RECUPERAR</button>
        </div>
    </div>

    <div id="main-screen" class="hidden">
        <div class="main-header">
            <div style="display:flex; justify-content:space-between">
                <div style="display:flex; gap:5px">
                    <button id="btn-toggle-log" class="btn ghost" style="padding:5px 10px">LOG</button>
                    <button id="btn-dark" class="btn ghost" style="padding:5px 10px">MODO</button>
                </div>
                <button id="btn-logout" class="btn danger" style="padding:5px 10px">SALIR</button>
            </div>

            <div class="grid-btns">
                <button id="btn-add" class="btn primary">NUEVA UF</button>
                <button id="btn-import" class="btn ghost admin-only">SUBIR</button>
                <button id="btn-export" class="btn ghost">BAJAR</button>
                <button id="btn-users" class="btn ghost admin-only">CUENTAS</button>
                <button id="btn-delete-all" class="btn danger admin-only">BORRAR BASE</button>
            </div>

            <input id="search-text" placeholder="Buscar..." style="margin-top:10px">
            <div class="grid-btns">
                <button id="btn-search" class="btn primary">BUSCAR</button>
                <button id="btn-clear" class="btn ghost">VER TODO</button>
                <button id="btn-list-empty" class="btn warning">VER VACÍOS</button>
            </div>
        </div>

        <div id="log-container" class="hidden"><b>SISTEMA:</b><div id="log-list"></div></div>
        <div id="list"></div>
    </div>

    <div id="modal-form" class="modal hidden">
        <div class="modal-content">
            <h3 id="form-title">Nueva Unidad</h3>
            <input id="f-uf" placeholder="UF">
            <input id="f-prop" placeholder="Propietario">
            <input id="f-telp" placeholder="Tel Propietario">
            <input id="f-inq" placeholder="Inquilino">
            <input id="f-teli" placeholder="Tel Inquilino">
            <div class="grid-btns">
                <button id="btn-save" class="btn primary">GUARDAR</button>
                <button id="btn-cancel" class="btn danger">CANCELAR</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
