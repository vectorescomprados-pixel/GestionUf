<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <title>GestiónUF Android</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-mode">
    <div class="wrap">
        <div id="login-screen" class="modal">
            <div class="modal-content">
                <h1 style="text-align:center">GestiónUF</h1>
                <input id="login-user" placeholder="Usuario">
                <input id="login-pass" type="password" placeholder="Contraseña">
                <button id="btn-login" class="btn primary" style="width:100%">INGRESAR</button>
            </div>
        </div>

        <div id="main-screen" class="hidden">
            <div class="main-header">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px">
                    <span style="color:#25d366">● ONLINE</span>
                    <div>
                        DARK <input type="checkbox" id="mode-toggle" checked>
                        LOG <input type="checkbox" id="log-toggle" checked>
                    </div>
                </div>
                <div class="grid-btns">
                    <button id="btn-add" class="btn primary"><i class="fas fa-plus"></i> UF</button>
                    <button id="btn-import" class="btn ghost admin-only"><i class="fas fa-file-upload"></i></button>
                    <button id="btn-export" class="btn ghost"><i class="fas fa-file-download"></i></button>
                    <button id="btn-users" class="btn ghost admin-only"><i class="fas fa-users-cog"></i></button>
                    <button id="btn-delete-all" class="btn danger admin-only"><i class="fas fa-bomb"></i></button>
                    <button id="btn-logout" class="btn danger"><i class="fas fa-power-off"></i></button>
                </div>
                <input id="search-text" placeholder="Buscar UF, nombre...">
                <div class="grid-btns">
                    <button id="btn-search" class="btn primary" style="grid-column: span 2">BUSCAR</button>
                    <button id="btn-clear" class="btn ghost">LIMPIAR</button>
                </div>
                <button id="btn-list-empty" class="btn warning-btn" style="background:#f59e0b; width:100%; border-radius:8px; height:35px; color:black; font-weight:bold; margin-top:5px">VER SIN CONTACTO</button>
            </div>

            <div class="content-body">
                <div id="list"></div>
                <div id="log-container" style="font-size:11px; margin-top:30px; border-top:1px solid var(--border)">
                    <p><b>HISTORIAL:</b></p>
                    <div id="log-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal hidden">
        <div class="modal-content">
            <h3>Ficha de Unidad</h3>
            <input id="f-uf" placeholder="Número UF">
            <input id="f-prop" placeholder="Propietario">
            <input id="f-telp" placeholder="Tel Propietario">
            <input id="f-inq" placeholder="Inquilino">
            <input id="f-teli" placeholder="Tel Inquilino">
            <div class="grid-btns">
                <button id="btn-save" class="btn primary">GUARDAR</button>
                <button id="btn-cancel" class="btn danger">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modal-users" class="modal hidden">
        <div class="modal-content">
            <h3>Cuentas de Acceso</h3>
            <div id="users-admin-list" style="max-height:100px; overflow:auto; margin-bottom:10px; font-size:12px"></div>
            <input id="u-name" placeholder="Usuario">
            <input id="u-pass" type="password" placeholder="Contraseña">
            <select id="u-role"><option value="user">Usuario</option><option value="admin">Admin</option></select>
            <div class="grid-btns">
                <button id="btn-save-user" class="btn primary">CREAR</button>
                <button id="btn-close-users" class="btn danger">CERRAR</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
