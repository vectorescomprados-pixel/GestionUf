<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <title>GestiónUF Cloud Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-mode">
    <input type="file" id="csv-file" accept=".csv" style="display:none">

    <div class="wrap">
        <div class="top-controls">
            <div class="control-group">
                <span>Ver Log</span>
                <label class="switch"><input type="checkbox" id="log-toggle" checked><span class="slider"></span></label>
            </div>
            <div class="control-group">
                <span>Modo Oscuro</span>
                <label class="switch"><input type="checkbox" id="mode-toggle" checked><span class="slider"></span></label>
            </div>
        </div>

        <div id="login-screen" class="card">
            <h1>GestiónUF Cloud</h1>
            <input id="login-user" placeholder="Usuario">
            <input id="login-pass" type="password" placeholder="Contraseña">
            <button id="btn-login" class="btn primary" style="width:100%">Entrar al Sistema</button>
        </div>

        <div id="main-screen" class="card hidden">
            <header>
                <h2>Panel Remoto</h2>
                <p class="muted">Sesión: <span id="current-user-display" style="font-weight:bold; color:var(--primary)"></span></p>
                <div id="sync-indicator" style="font-size: 10px; color: #22c55e; text-align: center; margin-top: 5px;">● Sincronizado con la Nube</div>
            </header>
            
            <div class="grid-btns">
                <button id="btn-logout" class="btn danger">Salir</button>
                <button id="btn-import" class="btn admin-only">Importar CSV</button>
                <button id="btn-export" class="btn admin-only">Exportar</button>
            </div>

            <section class="search-section">
                <input id="search-text" placeholder="Buscar en la nube (UF o Nombre)...">
                <div class="grid-btns">
                    <button id="btn-search" class="btn primary">Buscar</button>
                    <button id="btn-list" class="btn">Ver Todos</button>
                </div>
            </section>

            <button id="btn-add" class="btn primary" style="margin: 10px 0; width:100%">+ AGREGAR A LA NUBE</button>

            <div id="list"></div>

            <div id="log-container" class="log-container">
                <h4 class="muted">Actividad Global (Hoy)</h4>
                <div id="log-list"></div>
            </div>

            <div class="admin-only" style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px">
                <button id="btn-delete-db" class="btn danger" style="width:100%">BORRAR TODA LA NUBE</button>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal hidden">
        <div class="modal-content card">
            <h3>Datos de Unidad</h3>
            <input id="f-uf" placeholder="Unidad Funcional">
            <input id="f-prop" placeholder="Propietario">
            <input id="f-telp" placeholder="Tel Propietario">
            <input id="f-inq" placeholder="Inquilino">
            <input id="f-teli" placeholder="Tel Inquilino">
            <div class="grid-btns">
                <button id="btn-save" class="btn primary">Guardar en Nube</button>
                <button id="btn-cancel" class="btn danger">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
