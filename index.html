<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GestiónUF Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --primary: #2563eb; --danger: #e11d48; --text: #1f293b; --border: #e5e7eb; --warning: #f59e0b; --success: #22c55e; }
        body.dark-mode { --bg: #0b141a; --card: #111b21; --text: #e9edef; --border: #222d34; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; overflow-x: hidden; }
        
        .wrap { width: 95%; max-width: 450px; margin: auto; padding: 0 5px; position: relative; }
        
        /* Header Fijo */
        .main-header { position: fixed; top: 0; width: 95%; max-width: 450px; background: var(--card); z-index: 1000; padding: 15px; border-bottom: 3px solid var(--primary); border-radius: 0 0 15px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status-bar { font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 8px; }
        .online { color: var(--success); } .offline { color: var(--danger); }
        
        .content-body { margin-top: 360px; width: 100%; padding-bottom: 80px; }

        /* Consola Log */
        #log-panel { background: #000; color: #0f0; padding: 10px; font-size: 11px; border-radius: 8px; margin-bottom: 15px; height: 100px; overflow-y: auto; font-family: monospace; }

        /* Registros */
        .item { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .item.no-phone { border-left: 8px solid var(--warning); }

        /* Botones */
        .grid-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .btn { height: 42px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .primary { background: var(--primary); } .danger { background: var(--danger); } .ghost { background: #64748b; } .warning { background: var(--warning); color: #000; }

        input { width: 100%; height: 45px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); padding: 0 15px; background: var(--bg); color: var(--text); font-size: 16px; }

        /* Modales centrados */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        .hidden { display: none !important; }

        #btn-rocket { position: fixed; bottom: 20px; right: 15px; width: 45px; height: 45px; border-radius: 50%; z-index: 2000; }
    </style>
</head>
<body class="dark-mode">
    <button id="btn-rocket" class="btn primary hidden"><i class="fas fa-rocket"></i></button>
    <input type="file" id="csv-file" accept=".csv" class="hidden">

    <div id="login-screen" class="modal">
        <div class="modal-content text-center">
            <h2 style="color:var(--primary); text-align:center">GestiónUF</h2>
            <input id="login-user" placeholder="Usuario">
            <input id="login-pass" type="password" placeholder="Contraseña">
            <button id="btn-login" class="btn primary" style="width:100%">ENTRAR</button>
            <button id="btn-recover-open" class="btn ghost" style="width:100%; margin-top:10px">OLVIDÉ MI CONTRASEÑA</button>
        </div>
    </div>

    <div id="main-screen" class="hidden">
        <div class="wrap">
            <div class="main-header">
                <div id="conn-status" class="status-bar online">● APP EN LÍNEA</div>
                <div class="grid-btns">
                    <button id="btn-log-toggle" class="btn ghost">LOG</button>
                    <button id="btn-theme" class="btn ghost">MODO</button>
                    <button id="btn-logout" class="btn danger">SALIR</button>
                </div>
                <div class="grid-btns">
                    <button id="btn-add" class="btn primary">NUEVA UF</button>
                    <button id="btn-import" class="btn ghost">IMPORTAR</button>
                    <button id="btn-export" class="btn ghost">EXPORTAR</button>
                </div>
                <input id="search-input" placeholder="Buscar UF o Propietario...">
                <div class="grid-btns">
                    <button id="btn-search" class="btn primary">BUSCAR</button>
                    <button id="btn-clear" class="btn ghost">VER TODO</button>
                    <button id="btn-filter-empty" class="btn warning">VACÍOS</button>
                </div>
                <button id="btn-delete-all" class="btn danger" style="width:100%">BORRAR BASE DE DATOS</button>
            </div>
            <div class="content-body">
                <div id="log-panel" class="hidden"></div>
                <div id="list"></div>
            </div>
        </div>
    </div>

    <div id="modal-form" class="modal hidden">
        <div class="modal-content">
            <h3 id="form-title" style="margin-top:0">Ficha de Unidad</h3>
            <input id="f-uf" placeholder="UF">
            <input id="f-prop" placeholder="Propietario">
            <input id="f-telp" placeholder="Tel Propietario">
            <input id="f-inq" placeholder="Inquilino">
            <input id="f-teli" placeholder="Tel Inquilino">
            <div class="grid-btns">
                <button id="btn-save" class="btn primary">GUARDAR</button>
                <button id="btn-cancel" class="btn danger">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="modal hidden">
        <div class="modal-content" style="text-align:center">
            <h3 id="confirm-title">Confirmar</h3>
            <p id="confirm-msg" style="font-size:12px"></p>
            <input id="confirm-pass" type="password" placeholder="Clave Administrador">
            <div class="grid-btns">
                <button id="btn-confirm-yes" class="btn primary">SÍ</button>
                <button id="btn-confirm-no" class="btn danger">NO</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
